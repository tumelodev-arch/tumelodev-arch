name: Profile contribution calendar

on:
  push:
    branches: [main]
    paths-ignore:
      - "profile-3d-contrib/**"
  schedule:
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate isometric contribution calendar
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "Contribution calendar has no changes."
            exit 0
          fi
          git commit -m "chore: refresh profile contribution calendar"
          git push
