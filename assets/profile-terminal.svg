<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Tumelo Phale terminal banner</title>
  <desc id="desc">A dark terminal window with green and pink status lights, a shell prompt, the name Tumelo Phale and software engineering focus areas.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#26313b" stroke-width="1" opacity=".45"/>
    </pattern>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#56d4a2" stop-opacity=".12"/>
      <stop offset="1" stop-color="#f778ba" stop-opacity=".06"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="310" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="308" rx="17" fill="url(#grid)" stroke="#303943" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="46" rx="17" fill="#161b22"/>
  <path d="M1 30V47H1199V30" fill="#161b22"/>
  <circle cx="27" cy="24" r="6" fill="#f778ba"/>
  <circle cx="49" cy="24" r="6" fill="#d6b86a"/>
  <circle cx="71" cy="24" r="6" fill="#56d4a2"/>
  <text x="98" y="29" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">tumelo@github: ~/profile</text>
  <text x="1160" y="29" text-anchor="end" fill="#56d4a2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">SESSION: READY</text>
  <rect x="26" y="68" width="1148" height="216" rx="12" fill="url(#glow)" stroke="#27323c"/>
  <text x="54" y="104" fill="#56d4a2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">$ whoami</text>
  <text x="52" y="180" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="66" font-weight="800" letter-spacing="3">TUMELO PHALE</text>
  <text x="56" y="217" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19">SOFTWARE ENGINEERING</text>
  <text x="56" y="252" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">.NET  /  TYPESCRIPT  /  TESTING  /  RELIABLE DELIVERY</text>
  <rect x="1060" y="215" width="73" height="37" rx="5" fill="#56d4a2" opacity=".14" stroke="#56d4a2"/>
  <text x="1097" y="239" text-anchor="middle" fill="#56d4a2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">v1.0</text>
  <rect x="56" y="266" width="10" height="3" fill="#f778ba"/>
  <rect x="72" y="266" width="10" height="3" fill="#56d4a2"/>
  <rect x="88" y="266" width="10" height="3" fill="#8b949e"/>
  <text x="1134" y="271" text-anchor="end" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">BUILDING IN PUBLIC, WITH EVIDENCE</text>
</svg>